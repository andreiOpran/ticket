<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>24pay</title>
<link rel="icon" type="image/png" href="assets/logo-24pay.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#171a1f;
    --card:#2f333c;
    --card-2:#2f333c;
    --muted:#78828e;
    --text:#f2f3f5;
    --yellow:#e7cf35;
    --green:#167b4c;
    --track:#e5e9ec;
    --qr-border:#1f55ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    height:100dvh;
  }
  .phone{
    width:100%;
    max-width:430px;
    background:var(--bg);
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  /* ---------- status bar ---------- */
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 26px 8px;
    font-size:17px;
    font-weight:600;
  }
  .clock-pill{
    background:#ff3b30;
    color:#fff;
    border-radius:999px;
    padding:5px 16px;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    letter-spacing:.3px;
  }
  .status-right{display:flex;align-items:center;gap:7px;}
  .signal{display:flex;align-items:flex-end;gap:2.5px;height:13px;}
  .signal span{width:3.5px;background:#fff;border-radius:1px;}
  .signal span:nth-child(1){height:5px;}
  .signal span:nth-child(2){height:8px;}
  .signal span:nth-child(3){height:11px;}
  .signal span:nth-child(4){height:13px;}
  .lte{font-size:15px;font-weight:600;}
  .battery{
    width:27px;height:13px;border:1.5px solid #fff;border-radius:4px;
    position:relative;padding:1.5px;
  }
  .battery::after{content:"";position:absolute;right:-4px;top:3.5px;width:2.5px;height:5px;background:#fff;border-radius:0 2px 2px 0;}
  .battery i{display:block;height:100%;width:55%;background:#fff;border-radius:1.5px;}

  /* ---------- header ---------- */
  .header{
    display:grid;
    grid-template-columns:32px 1fr;
    align-items:center;
    padding:16px 20px 12px;
    gap:6px;
    flex-shrink:0;
    background:var(--bg);
    z-index:2;
  }
  .back{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    color:#fff;background:none;border:none;cursor:pointer;
  }
  .back svg{width:13px;height:22px;}
  .brandbar{
    display:flex;align-items:center;justify-content:center;gap:18px;
  }
  .brandbar .pay{height:30px;}
  .brandbar .support{color:var(--text);font-size:10px;white-space:nowrap;}
  .brandbar .bt{height:40px;}

  /* ---------- content ---------- */
  .scroll-area{
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    justify-content:safe center;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .scroll-area::-webkit-scrollbar{width:0;height:0;display:none;}
  .content{padding:4px 16px 28px;display:flex;flex-direction:column;gap:16px;}

  .card{
    background:var(--card);
    border-radius:8px;
    padding:14px;
  }

  /* QR */
  .qr-wrap{
    background:#fff;
    border:7px solid var(--qr-border);
    border-radius:10px;
    padding:12px;
    width:100%;
    display:block;
  }
  #qr{width:100%;display:block;line-height:0;}
  #qr canvas{width:100%!important;height:auto!important;display:block;image-rendering:pixelated;border-radius:0;}

  .countdown{
    text-align:center;
    font-size:18px;
    font-weight:400;
    margin-top:20px;
    line-height:1.5;
  }
  .countdown .label2{display:block;}

  .progress-track{
    margin-top:14px;
    height:13px;
    background:var(--track);
    border-radius:5px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--green);
    border-radius:0;
    width:5%;
    transition:width .9s linear;
  }
  .valid-dates{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:15px;
    font-variant-numeric:tabular-nums;
  }

  /* details */
  .details{padding:12px 14px 14px;}
  .row{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:7px 0;
  }
  .row .k{color:var(--muted);font-size:15px;white-space:nowrap;}
  .row .v{color:var(--text);font-size:16px;font-weight:400;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row .v.wrap{white-space:normal;}
  .email-btn{
    margin-top:12px;
    width:100%;
    background:transparent;
    border:2px solid var(--yellow);
    color:var(--yellow);
    border-radius:12px;
    padding:12px;
    font-size:15px;
    font-weight:400;
    cursor:pointer;
    transition:background .15s ease;
  }
  .email-btn:active{background:rgba(244,210,36,.12);}
</style>
</head>
<body>
  <div class="phone" data-screen-label="ticket">
    <!-- header -->
    <div class="header">
      <button class="back" aria-label="Înapoi">
        <svg viewBox="0 0 13 22" fill="none"><path d="M11 2L2 11l9 9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="brandbar">
        <img class="pay" src="assets/logo-24pay.png" alt="24pay">
        <span class="support">susținut de</span>
        <img class="bt" src="assets/logo-bt.png" alt="Banca Transilvania">
      </div>
    </div>

    <!-- content -->
    <div class="scroll-area" id="scrollArea">
    <div class="content">
      <div class="card">
        <div class="qr-wrap"><div id="qr"></div></div>
        <div class="countdown">
          <span id="cdLine">Cod control valabil <span id="secs">14</span> secunde.</span>
          <span class="label2">Valabilitate:</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
        <div class="valid-dates">
          <span id="validFrom">—</span>
          <span id="validTo">—</span>
        </div>
      </div>

      <div class="card details">
        <div class="row"><span class="k">Tip bilet:</span><span class="v wrap">STB - metropolitan 90 min.</span></div>
        <div class="row"><span class="k">Data achiziției:</span><span class="v" id="purchaseDate">—</span></div>
        <div class="row"><span class="k">Număr comandă:</span><span class="v" id="orderNo">—</span></div>
        <button class="email-btn">Trimite chitanța prin email</button>
      </div>
    </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- helpers ---------- */
  function pad(n){return String(n).padStart(2,"0");}
  function fmt(d){
    return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+"|"+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function uuid32(){
    if(window.crypto && crypto.randomUUID){
      return crypto.randomUUID().replace(/-/g,"");
    }
    var s="",h="0123456789abcdef";
    for(var i=0;i<32;i++) s+=h[Math.floor(Math.random()*16)];
    return s;
  }

  /* ---------- QR rendering ---------- */
  var qrBox=document.getElementById("qr");
  function drawQR(data){
    qrBox.innerHTML="";
    var count, isDark;
    if(typeof qrcode==="function"){
      try{
        var qr=qrcode(0,"M");
        qr.addData(data);
        qr.make();
        count=qr.getModuleCount();
        isDark=function(r,c){return qr.isDark(r,c);};
      }catch(e){ count=0; }
    }
    if(!count){
      // fallback: deterministic pseudo-QR grid from the data
      count=33;
      var seed=0; for(var k=0;k<data.length;k++) seed=(seed*31+data.charCodeAt(k))>>>0;
      function rnd(){ seed=(seed*1103515245+12345)>>>0; return (seed>>>16)&1; }
      var grid=[];
      for(var r=0;r<count;r++){grid[r]=[];for(var c=0;c<count;c++)grid[r][c]=rnd();}
      // finder patterns
      function finder(or,oc){
        for(var i=-1;i<=7;i++)for(var j=-1;j<=7;j++){
          var rr=or+i,cc=oc+j; if(rr<0||cc<0||rr>=count||cc>=count)continue;
          var on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
          grid[rr][cc]=on?1:0;
        }
      }
      finder(0,0);finder(0,count-7);finder(count-7,0);
      isDark=function(r,c){return grid[r][c]===1;};
    }

    var size=420;
    var cell=Math.floor(size/count);
    var dim=cell*count;
    var canvas=document.createElement("canvas");
    canvas.width=dim;canvas.height=dim;
    var ctx=canvas.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,dim,dim);
    ctx.fillStyle="#000";
    for(var r=0;r<count;r++){
      for(var c=0;c<count;c++){
        if(isDark(r,c)) ctx.fillRect(c*cell,r*cell,cell,cell);
      }
    }
    qrBox.appendChild(canvas);
  }

  /* ---------- countdown + QR cycle ---------- */
  var cdLine=document.getElementById("cdLine");
  var secs=14;
  function showCounting(){ cdLine.textContent="Cod control valabil "+secs+" secunde."; }
  function newCode(){ drawQR(uuid32()); secs=14; showCounting(); }
  function loop(){
    if(secs>0){ secs--; showCounting(); setTimeout(loop,1000); return; }
    // secs reached 0 (already shown) -> show loading for a random 0.3-1s
    cdLine.textContent="Încărcare cod de control";
    setTimeout(function(){ newCode(); setTimeout(loop,1000); }, 300+Math.random()*700);
  }
  newCode();
  setTimeout(loop,1000);

  /* ---------- ticket validity (90 min) ---------- */
  var TOTAL_MIN=90;
  var now=new Date();
  // elapsed kept >=10 min after purchase and >=30 min before expiry
  var MIN_SINCE_BUY=10, MIN_BEFORE_EXPIRY=30;
  var span=TOTAL_MIN-MIN_SINCE_BUY-MIN_BEFORE_EXPIRY; // 50
  var elapsedMin=Math.floor(Math.random()*(span+1))+MIN_SINCE_BUY; // 10..60 min in
  var purchase=new Date(now.getTime()-elapsedMin*60000);
  var validTo=new Date(purchase.getTime()+TOTAL_MIN*60000);

  document.getElementById("validFrom").textContent=fmt(purchase);
  document.getElementById("validTo").textContent=fmt(validTo);
  document.getElementById("purchaseDate").textContent=fmt(purchase);

  // order number: 24 + 7 random digits
  var ord="24"; for(var i=0;i<7;i++) ord+=Math.floor(Math.random()*10);
  document.getElementById("orderNo").textContent=ord;

  var progressEl=document.getElementById("progress");
  function updateProgress(){
    var elapsed=(Date.now()-purchase.getTime())/60000;
    var pct=Math.max(0,Math.min(100,(elapsed/TOTAL_MIN)*100));
    progressEl.style.width=pct.toFixed(2)+"%";
  }
  updateProgress();
  setInterval(updateProgress,1000);

  /* ---------- snap content back to original position ---------- */
  var scrollArea=document.getElementById("scrollArea");
  var snapTimer=null;
  scrollArea.addEventListener("scroll",function(){
    if(snapTimer) clearTimeout(snapTimer);
    snapTimer=setTimeout(function(){
      scrollArea.scrollTo({top:0,behavior:"smooth"});
    },180);
  },{passive:true});
})();
</script>
</body>
</html>
